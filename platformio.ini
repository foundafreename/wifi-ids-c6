; Waveshare ESP32-C6-LCD-1.47 — passiver WLAN-Intrusion-Detector
; Arduino-Core 3.x via pioarduino

[env:waveshare_c6_lcd147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; Modul auf dem Waveshare-Board ist ein ESP32-C6FH4 (4 MB internes Flash)
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv   ; 3 MB App, kein OTA — Headroom fuer NTFY_ENABLE (TLS)

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLGFX_USE_V1
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
